<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2967A7">
  <title>Ubicación en desarrollo | Moments of Peace</title>
  <link rel="icon" type="image/svg+xml" href="img/logo.svg">
  <style>
    :root{--blue:#2967a7;--teal:#42aaac;--green:#32986c;--ink:#173144;--muted:#647784}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:radial-gradient(circle at 20% 15%,rgba(61,156,187,.16),transparent 27rem),radial-gradient(circle at 90% 80%,rgba(50,152,108,.12),transparent 28rem),#f9fdfd}
    .panel{width:min(680px,100%);text-align:center;padding:clamp(30px,7vw,60px);background:rgba(255,255,255,.9);border:1px solid rgba(41,103,167,.13);border-radius:32px;box-shadow:0 24px 70px rgba(31,84,111,.14);backdrop-filter:blur(16px)}
    img{width:min(190px,48vw);height:auto;margin:0 auto 22px}.code{display:inline-flex;padding:7px 12px;border-radius:999px;background:rgba(50,152,108,.1);color:var(--green);font-weight:800;font-size:.82rem;letter-spacing:.08em}h1{font-size:clamp(2.2rem,8vw,4.5rem);line-height:1;margin:20px 0 14px;letter-spacing:-.05em}p{margin:0 auto;max-width:500px;color:var(--muted);font-size:1.05rem;line-height:1.7}.actions{display:flex;justify-content:center;flex-wrap:wrap;gap:12px;margin-top:30px}.btn{min-height:52px;display:inline-flex;align-items:center;justify-content:center;padding:0 20px;border-radius:15px;font-weight:800;text-decoration:none;transition:transform .2s ease,box-shadow .2s ease}.primary{color:#fff;background:linear-gradient(135deg,var(--blue),var(--teal));box-shadow:0 14px 30px rgba(41,103,167,.22)}.secondary{color:var(--blue);background:#fff;border:1px solid rgba(41,103,167,.16)}.btn:hover{transform:translateY(-3px)}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);margin-right:8px;animation:pulse 1.4s ease-in-out infinite}@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(50,152,108,.1)}}@media(max-width:520px){.actions{display:grid}.btn{width:100%}}
  </style>
</head>
<body>
  <main class="panel">
    <img src="img/logo.svg" alt="Moments of Peace">
    <span class="code"><span class="dot"></span>404 · EN DESARROLLO</span>
    <h1>Estamos trabajando en esta sección.</h1>
    <p>La ubicación todavía no está disponible. Muy pronto podrás consultarla directamente desde nuestro sitio.</p>
    <div class="actions">
      <a class="btn primary" href="index.html">Volver al inicio</a>
      <a class="btn secondary" href="https://wa.me/529993925467" target="_blank" rel="noopener noreferrer">Contactar por WhatsApp</a>
    </div>
  </main>
</body>
</html>
